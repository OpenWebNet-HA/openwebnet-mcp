name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit tests with pytest
      run: |
        pytest --cov=src/openwebnet_mcp --cov-report=xml --cov-fail-under=95 tests/

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  launch-scripts:
    name: Validate launch scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Set up virtual environment and package
      run: |
        python -m venv .venv
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Test shell launcher (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        chmod +x run_server.sh
        bash -n run_server.sh

    - name: Test CMD launcher (Windows)
      if: runner.os == 'Windows'
      run: |
        cmd /c "if exist run_server.cmd (exit 0) else (exit 1)"

  build-wheel:
    name: Validate Wheel Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build
      run: pip install build twine

    - name: Build sdist and wheel
      run: python -m build

    - name: Check package metadata
      run: twine check dist/*
