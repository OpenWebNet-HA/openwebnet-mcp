[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwebnet-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for browsing OpenWebNet protocol documentation, WHO specifications, frame validation, and Home Assistant MyHOME integration knowledge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "OpenWebNet-HA Community", email = "community@openwebnet-ha.org" }
]
keywords = [
    "mcp",
    "openwebnet",
    "myhome",
    "bticino",
    "legrand",
    "home-assistant",
    "smart-home",
    "iot"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries"
]
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[project.scripts]
openwebnet-mcp = "openwebnet_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openwebnet_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src/openwebnet_mcp --cov-report=term-missing"
